<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lacrosse Drill Finder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <span class="logo">🥍</span>
      <div>
        <h1>Lacrosse Drill Finder</h1>
        <p class="tagline">Pick a skill. Get drills to work on it.</p>
      </div>
    </div>
  </header>

  <main>
    <section id="skill-picker" aria-label="Skill selection">
      <h2 class="section-title">What do you want to work on?</h2>
      <div id="skill-grid" class="skill-grid"></div>
    </section>

    <section id="drill-results" class="drill-results" hidden>
      <div class="results-header">
        <button id="back-button" class="back-button" type="button">&larr; All skills</button>
        <div>
          <h2 id="results-title"></h2>
          <p id="results-description" class="results-description"></p>
        </div>
      </div>
      <div id="drill-list" class="drill-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Built for players who want purposeful reps.</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
